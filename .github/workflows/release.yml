name: Release

# main  → rolling "latest" pre-release (NMUCompat-latest-macos-universal.zip)
# v*    → versioned release        (NMUCompat-<version>-macos-universal.zip)
#
# Both channels are Developer ID signed, notarized and stapled. Any failed gate stops the job
# before publication. Runs only on pushes to this repository (never on pull requests), so
# release secrets are not exposed to untrusted code.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: v
        run: |
          sha="$(git rev-parse --short HEAD)"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "bundle_version=${version%%[-+]*}" >> "$GITHUB_OUTPUT"
            echo "zip_label=$version" >> "$GITHUB_OUTPUT"
            echo "channel=tag" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-latest+$sha" >> "$GITHUB_OUTPUT"
            echo "bundle_version=0.0.0" >> "$GITHUB_OUTPUT"
            echo "zip_label=latest" >> "$GITHUB_OUTPUT"
            echo "channel=latest" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Test
        run: swift test

      - name: Install Developer ID certificate (temporary keychain)
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/release-macos.sh install-cert

      - name: Build universal app + CLI, sign with Developer ID
        env:
          UNIVERSAL: "1"
          VERSION: ${{ steps.v.outputs.version }}
          BUNDLE_VERSION: ${{ steps.v.outputs.bundle_version }}
        run: ./scripts/bundle.sh   # SIGN_IDENTITY comes from the previous step via GITHUB_ENV

      - name: Verify signatures
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/release-macos.sh verify-signed

      - name: Notarize and staple
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY_P8_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_P8_BASE64 }}
        run: ./scripts/release-macos.sh notarize

      - name: Package final zip + SHA-256
        env:
          UNIVERSAL: "1"
          VERSION: ${{ steps.v.outputs.version }}
          ZIP_LABEL: ${{ steps.v.outputs.zip_label }}
        run: ./scripts/package.sh

      - name: Verify the exact final zip
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/release-macos.sh verify-zip "dist/NMUCompat-${{ steps.v.outputs.zip_label }}-macos-universal.zip"

      - name: Publish versioned release
        if: steps.v.outputs.channel == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: dist/NMUCompat-${{ steps.v.outputs.zip_label }}-macos-universal.zip
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ZIP" "$ZIP.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP" "$ZIP.sha256" \
              --verify-tag --title "NMUCompat $GITHUB_REF_NAME" --generate-notes
          fi

      - name: Publish rolling "latest" pre-release
        if: steps.v.outputs.channel == 'latest'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.v.outputs.sha }}
          ZIP: dist/NMUCompat-latest-macos-universal.zip
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest
          notes="Automated build of main at ${SHA} (Developer ID signed and notarized). Untested pre-release — use a versioned release for production."
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest "$ZIP" "$ZIP.sha256" --clobber
            gh release edit latest --prerelease --title "Latest (main @ ${SHA})" --notes "$notes"
          else
            gh release create latest "$ZIP" "$ZIP.sha256" \
              --prerelease --title "Latest (main @ ${SHA})" --notes "$notes"
          fi

      - name: Remove temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release-signing.keychain-db" 2>/dev/null || true
